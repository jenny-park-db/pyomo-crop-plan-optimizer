[project]
name = "cropplan"
version = "0.2.0"
requires-python = ">=3.11,<3.13"
dependencies = ["pyomo>=6.10,<7", "highspy>=1.15,<2", "pandas>=2.2,<3", "numpy>=1.26"]

[project.scripts]
cropplan-seed = "cropplan_jobs.cli:seed"
cropplan-solve = "cropplan_jobs.cli:solve"
cropplan-stress-prepare = "cropplan_jobs.cli:stress_prepare"
cropplan-stress-load = "cropplan_jobs.cli:stress_load"

[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6", "pyarrow>=14", "databricks-sdk>=0.70"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cropplan", "src/cropplan_jobs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs against a deployed bundle target in a Databricks workspace (deselected by default)"]
addopts = "-m \"not integration\""
